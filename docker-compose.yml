services:
  postgres:
    image: postgres:16.6
    environment:
      POSTGRES_DB: flight_scanner
      POSTGRES_USER: flight_scanner
      POSTGRES_PASSWORD: local-only-placeholder
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flight_scanner -d flight_scanner"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.2
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql+psycopg://flight_scanner:local-only-placeholder@postgres:5432/flight_scanner
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: local-development-secret-replace-with-32-random-bytes
      ALLOW_LIVE_PROVIDERS: "false"
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
